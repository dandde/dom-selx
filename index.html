<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Scraper OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#fdfbf7',
                        'paper-dark': '#f0eeea',
                        ink: '#111111',
                        'ink-light': '#555555',
                    },
                    fontFamily: {
                        mono: ['"IBM Plex Mono"', 'monospace'],
                        serif: ['"Merriweather"', 'serif'],
                    },
                    boxShadow: {
                        'hard': '3px 3px 0px 0px #111111',
                        'flat': '0 1px 0 0 #111111',
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fdfbf7;
            color: #111111;
            font-family: 'IBM Plex Mono', monospace;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f0eeea;
            border-left: 1px solid #111111;
        }
        ::-webkit-scrollbar-thumb {
            background: #111111;
            border: 1px solid #f0eeea;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333; 
        }

        /* Tree Lines */
        .tree-line {
            position: relative;
        }
        .tree-line::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 0;
            bottom: 0;
            width: 1px;
            border-left: 1px dotted #999; 
        }
        
        /* Iframe Pattern Background */
        .iframe-bg-pattern {
            background-image: 
                linear-gradient(45deg, #f0eeea 25%, transparent 25%), 
                linear-gradient(-45deg, #f0eeea 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #f0eeea 75%), 
                linear-gradient(-45deg, transparent 75%, #f0eeea 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
